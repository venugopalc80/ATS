name: AQERITH Section 4 sourcing tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/routers/sourcing.py"
      - "backend/app/main.py"
      - "backend/tests/test_sourcing*.py"
      - "backend/requirements.txt"
      - "frontend/app/search/**"
      - "frontend/app/imports/**"
      - "frontend/app/talent-pools/**"
      - "frontend/app/campaigns/**"
      - "supabase/migrations/20261022*.sql"
      - ".github/workflows/section-4-sourcing.yml"

jobs:
  sourcing-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run sourcing tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p "test_sourcing*.py" -v
