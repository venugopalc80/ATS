name: Dashboard Update 1 Acceptance

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/dashboard-update-1-acceptance.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ats_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend unit tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Run PostgreSQL integration tests (disposable database only)
        working-directory: backend
        env:
          PYTHONPATH: .
          ATS_INTEGRATION_TESTS: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ats_test
        run: python -m unittest tests.test_postgres_dashboard_integration tests.test_postgres_recruitment_integration -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
