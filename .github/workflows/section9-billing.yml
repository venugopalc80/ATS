name: Section 9 billing tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/routers/billing.py"
      - "backend/app/routers/billing_webhooks.py"
      - "backend/app/services/entitlement_policy.py"
      - "backend/tests/test_billing.py"
      - "backend/tests/test_billing_webhooks.py"
      - "backend/tests/test_entitlement_policy.py"
      - "backend/requirements.txt"
      - ".github/workflows/section9-billing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Test entitlement policy
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_entitlement_policy.py" -v
      - name: Test billing API
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_billing.py" -v
      - name: Test Stripe webhook safeguards
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_billing_webhooks.py" -v
