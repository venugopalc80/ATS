name: Section 8 privacy and security tests

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/section8-tests.yml"
  push:
    branches: ["feat/section8-security-privacy-resilience"]
    paths:
      - "backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/section8-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_privacy_models.py tests/test_documents_validation.py tests/test_dashboard.py tests/test_recruitment_submission_workflow.py
